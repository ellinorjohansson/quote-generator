<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote generator</title>
  </head>
  <body>
    <main>
      <section class="quote-section">
        <p id="quoteDisplay" class="quote-display"></p>
        <div class="buttons">
          <button id="quoteButton" class="quote-button">Generate quote </button>
          <button id="favoriteButton" class="favorites-button">Add to favorites 🩶</button>
        </div>
      </section>
      <section class="favorites-section">
        <h2 class="favorites-header">Favorites</h2>
        <ul id="favoriteQuotes" class="favorite-quote"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
